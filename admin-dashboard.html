<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartify Admin — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./CSS/all.min.css" />
  <link rel="stylesheet" href="./CSS/admin.css" />
  <style>
    /* Dashboard-only layout. Shared tokens and components come from admin.css. */
    .admin-main { min-width: 0; } /* let wide tables scroll inside their card instead of widening the page */
    .dash { display: flex; flex-direction: column; gap: 20px; max-width: 1280px; }

    .dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .dash-head h1 { font-size: 1.55rem; font-weight: 700; color: var(--brand-dark); letter-spacing: -.3px; }
    .dash-head p { color: var(--neutral-400); font-size: .88rem; margin-top: 4px; }
    .dash-head .btn-action { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: .82rem; }

    .card { background: #fff; border: 1px solid var(--neutral-200); border-radius: 14px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 0; }
    .card-title { font-size: .95rem; font-weight: 700; color: var(--brand-dark); }
    .card-sub { font-size: .78rem; color: var(--neutral-400); margin-top: 2px; }
    .card-link { font-size: .78rem; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
    .card-link:hover { text-decoration: underline; }
    .card-body { padding: 16px 20px 20px; }

    /* KPIs */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; transition: border-color .15s, box-shadow .15s; }
    a.kpi:hover { border-color: #c7d2fe; box-shadow: 0 4px 16px rgba(2, 6, 126, .06); }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; }
    .kpi-label { font-size: .78rem; font-weight: 600; color: var(--neutral-600); }
    .kpi-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: .85rem; background: var(--accent-light); color: var(--brand-blue); }
    .kpi-value { font-size: 1.75rem; font-weight: 700; color: var(--brand-dark); line-height: 1; letter-spacing: -.5px; }
    .kpi-sub { font-size: .76rem; color: var(--neutral-400); }
    .kpi-sub b { color: var(--neutral-600); font-weight: 600; }
    .kpi.alert .kpi-icon { background: #fef3c7; color: #b45309; }

    /* Rows */
    .row { display: grid; gap: 16px; }
    .row-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
    .row-1-1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

    /* Orders chart */
    .chart { position: relative; height: 220px; }
    .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .chart .bar { fill: #c7d2fe; transition: fill .15s; }
    .chart .bar.today { fill: var(--brand-blue); }
    .chart g:hover .bar { fill: var(--accent); }
    .chart .grid { stroke: var(--neutral-200); stroke-dasharray: 3 4; }
    .chart text { font-family: inherit; font-size: 11px; fill: var(--neutral-400); }
    .chart-legend { display: flex; gap: 20px; margin-top: 12px; font-size: .78rem; color: var(--neutral-400); }
    .chart-legend b { color: var(--brand-dark); font-size: .95rem; display: block; }

    /* Status breakdown */
    .status-list { display: flex; flex-direction: column; gap: 14px; }
    .status-row { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 10px; font-size: .82rem; }
    .status-row span:first-child { color: var(--neutral-600); text-transform: capitalize; }
    .status-row span:last-child { text-align: right; font-weight: 600; color: var(--brand-dark); }
    .track { height: 8px; border-radius: 99px; background: var(--neutral-100); overflow: hidden; }
    .track i { display: block; height: 100%; border-radius: 99px; }

    /* SmartBox */
    .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .verdict { border-radius: 12px; padding: 12px 14px; }
    .verdict b { display: block; font-size: 1.4rem; line-height: 1.1; }
    .verdict span { font-size: .74rem; font-weight: 600; }
    .verdict.ok { background: #f0fdf4; color: #166534; }
    .verdict.warn { background: #fffbeb; color: #92400e; }
    .verdict.err { background: #fef2f2; color: #991b1b; }
    .list-label { font-size: .72rem; font-weight: 600; color: var(--neutral-400); text-transform: uppercase; letter-spacing: .6px; margin: 18px 0 6px; }

    /* Compact lists */
    .list { display: flex; flex-direction: column; }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--neutral-100); text-decoration: none; color: inherit; }
    .item:first-child { border-top: 0; }
    .thumb { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: var(--neutral-100); flex: none; display: grid; place-items: center; color: var(--neutral-400); font-size: .85rem; }
    .item-main { flex: 1; min-width: 0; }
    .item-title { font-size: .86rem; font-weight: 600; color: var(--brand-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: .75rem; color: var(--neutral-400); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
    .chip { font-size: .68rem; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
    .chip.ok { background: #dcfce7; color: #166534; }
    .chip.warn { background: #fef3c7; color: #92400e; }
    .chip.err { background: #fee2e2; color: #991b1b; }
    .chip.wait { background: #dbeafe; color: #1e40af; }
    .chip.none { background: var(--neutral-100); color: var(--neutral-400); }

    /* Recent orders table */
    .orders-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    .orders-table th { text-align: left; font-size: .72rem; font-weight: 600; color: var(--neutral-400); text-transform: uppercase; letter-spacing: .6px; padding: 0 12px 10px; border-bottom: 1px solid var(--neutral-200); }
    .orders-table td { padding: 12px; border-bottom: 1px solid var(--neutral-100); white-space: nowrap; }
    .orders-table tr:last-child td { border-bottom: 0; }
    .orders-table th:first-child, .orders-table td:first-child { padding-left: 0; }
    .orders-table th:last-child, .orders-table td:last-child { padding-right: 0; text-align: right; }
    .order-id { font-family: ui-monospace, monospace; font-weight: 600; color: var(--brand-blue); }
    .muted { color: var(--neutral-400); }

    .empty { padding: 28px 0; text-align: center; color: var(--neutral-400); font-size: .85rem; }
    .empty i { display: block; font-size: 1.4rem; margin-bottom: 8px; opacity: .6; }
    .skeleton { background: linear-gradient(90deg, var(--neutral-100), var(--neutral-50), var(--neutral-100)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .row-2-1, .row-1-1 { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 560px) {
      .admin-content { padding: 16px; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
      .kpi { padding: 14px; }
      .kpi-value { font-size: 1.35rem; }
      .verdict b { font-size: 1.15rem; }
      .orders-table .hide-sm { display: none; }
      .orders-table th, .orders-table td { padding-left: 6px; padding-right: 6px; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <aside class="admin-sidebar" id="admin-sidebar"></aside>

  <div class="admin-main">
    <header class="admin-header">
      <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
      <span class="page-title">Dashboard</span>
    </header>

    <div class="admin-content">
      <div class="dash">
        <div class="dash-head">
          <div>
            <h1 id="greeting">Overview</h1>
            <p id="today"></p>
          </div>
          <a href="./index.html" class="btn-action btn-ghost"><i class="fa-solid fa-arrow-up-right-from-square"></i> View store</a>
        </div>

        <!-- KPIs -->
        <div class="kpis" id="kpis">
          <div class="card kpi"><div class="skeleton" style="height:76px"></div></div>
          <div class="card kpi"><div class="skeleton" style="height:76px"></div></div>
          <div class="card kpi"><div class="skeleton" style="height:76px"></div></div>
          <div class="card kpi"><div class="skeleton" style="height:76px"></div></div>
        </div>

        <!-- Orders trend + status -->
        <div class="row row-2-1">
          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">Orders</div>
                <div class="card-sub">Last 14 days</div>
              </div>
              <a class="card-link" href="./admin-orders.html">All orders →</a>
            </div>
            <div class="card-body">
              <div class="chart" id="orders-chart"><div class="skeleton" style="height:100%"></div></div>
              <div class="chart-legend" id="chart-legend"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">Order status</div>
                <div class="card-sub" id="status-sub">&nbsp;</div>
              </div>
            </div>
            <div class="card-body">
              <div class="status-list" id="status-list"><div class="skeleton" style="height:160px"></div></div>
            </div>
          </div>
        </div>

        <!-- SmartBox + returns -->
        <div class="row row-1-1">
          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">SmartBox checks</div>
                <div class="card-sub">Weight + photo check, latest drop-off per return</div>
              </div>
              <a class="card-link" href="./admin-camera.html">Camera sessions →</a>
            </div>
            <div class="card-body" id="smartbox"><div class="skeleton" style="height:180px"></div></div>
          </div>

          <div class="card">
            <div class="card-head">
              <div>
                <div class="card-title">Recent returns</div>
                <div class="card-sub" id="returns-sub">&nbsp;</div>
              </div>
              <a class="card-link" href="./admin-returns.html">All returns →</a>
            </div>
            <div class="card-body"><div class="list" id="returns-list"><div class="skeleton" style="height:180px"></div></div></div>
          </div>
        </div>

        <!-- Recent orders -->
        <div class="card">
          <div class="card-head">
            <div>
              <div class="card-title">Recent orders</div>
              <div class="card-sub">Latest 6</div>
            </div>
            <a class="card-link" href="./admin-orders.html">All orders →</a>
          </div>
          <div class="card-body" style="overflow-x:auto">
            <table class="orders-table">
              <thead>
                <tr><th>Order</th><th>Customer</th><th class="hide-sm">Items</th><th class="hide-sm">Date</th><th>Status</th><th>Total</th></tr>
              </thead>
              <tbody id="orders-body"><tr><td colspan="6"><div class="skeleton" style="height:120px"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAdmin, injectSidebar, fmtDate } from './Js/admin-core.js';
    import { statsAPI, returnsAdminAPI, cameraAdminAPI, ordersAdminAPI } from './Js/admin-api.js';

    const user = await requireAdmin();
    if (!user) throw '';

    // ── Helpers ──────────────────────────────────────────────────────────────
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const money = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pick = (res, key) => res?.[key] ?? res?.data?.[key];
    const dayKey = (d) => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`; };
    const ago = (iso) => {
      const m = Math.round((Date.now() - new Date(iso)) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m} min ago`;
      if (m < 1440) return `${Math.round(m / 60)} h ago`;
      return fmtDate(iso);
    };
    const empty = (icon, text) => `<div class="empty"><i class="fa-solid ${icon}"></i>${text}</div>`;

    const ORDER_STATUS = {
      placed:    { label: 'Placed',    color: '#94a3b8', badge: 'badge-expired' },
      confirmed: { label: 'Confirmed', color: '#6366f1', badge: 'badge-info' },
      shipping:  { label: 'Shipping',  color: '#3b82f6', badge: 'badge-processing' },
      delivered: { label: 'Delivered', color: '#22c55e', badge: 'badge-completed' },
      cancelled: { label: 'Cancelled', color: '#ef4444', badge: 'badge-denied' },
      refunded:  { label: 'Refunded',  color: '#f59e0b', badge: 'badge-pending' },
    };
    const orderBadge = (s) => `<span class="badge ${ORDER_STATUS[s]?.badge || 'badge-info'}">${esc(ORDER_STATUS[s]?.label || s)}</span>`;

    const VERDICT = {
      match:      { cls: 'ok',   label: 'Verified' },
      review:     { cls: 'warn', label: 'Needs review' },
      error:      { cls: 'err',  label: 'Check failed' },
      processing: { cls: 'wait', label: 'Checking…' },
    };
    const verdictChip = (v) => v ? `<span class="chip ${VERDICT[v.verdict]?.cls || 'none'}">${VERDICT[v.verdict]?.label || esc(v.verdict)}</span>` : '<span class="chip none">Not dropped off</span>';
    const RETURN_STATUS = { pending: 'badge-pending', completed: 'badge-completed', expired: 'badge-expired', denied: 'badge-denied' };

    // ── Load everything in parallel ──────────────────────────────────────────
    const [ordersR, returnsR, sessionsR, usersR, productsR] = await Promise.allSettled([
      ordersAdminAPI.getAll({ limit: 100 }),
      returnsAdminAPI.getAll({ limit: 100 }),
      cameraAdminAPI.getSessions({ limit: 100 }),
      statsAPI.users(),
      statsAPI.products(),
    ]);
    const ok = (r) => r.status === 'fulfilled' ? r.value : null;
    const orders   = pick(ok(ordersR), 'orders') || [];
    const returns  = pick(ok(returnsR), 'returns') || [];
    const sessions = pick(ok(sessionsR), 'sessions') || [];
    const totals = {
      orders:    pick(ok(ordersR), 'total') ?? orders.length,
      returns:   pick(ok(returnsR), 'total') ?? returns.length,
      customers: pick(ok(usersR), 'total'),
      products:  pick(ok(productsR), 'total'),
    };
    const pendingReturns = returns.filter((r) => r.status === 'pending').length;
    // A return can be dropped off more than once; only its latest attempt counts (sessions come newest first)
    const seenReturns = new Set();
    const latestSessions = sessions.filter((s) => {
      const id = s.returnId?._id || s.returnId;
      if (!id) return true;
      if (seenReturns.has(id)) return false;
      seenReturns.add(id);
      return true;
    });
    injectSidebar(user, pendingReturns);

    // ── Header ───────────────────────────────────────────────────────────────
    const hour = new Date().getHours();
    const name = user?.firstName || user?.name || 'Admin';
    document.getElementById('greeting').textContent = `${hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening'}, ${name}`;
    document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) + ' · Here’s how the store is doing.';

    // ── KPIs ─────────────────────────────────────────────────────────────────
    const counted = orders.filter((o) => !['cancelled', 'refunded'].includes(o.status));
    const revenue = counted.reduce((sum, o) => sum + (o.totalPrice || 0), 0);
    const weekAgo = Date.now() - 7 * 864e5;
    const ordersThisWeek = orders.filter((o) => new Date(o.createdAt) >= weekAgo).length;
    const revenueThisWeek = counted.filter((o) => new Date(o.createdAt) >= weekAgo).reduce((s, o) => s + (o.totalPrice || 0), 0);
    const avgOrder = counted.length ? revenue / counted.length : 0;
    const needsReview = latestSessions.filter((s) => ['review', 'error'].includes(s.verification?.verdict)).length;

    const kpis = [
      { label: 'Revenue', icon: 'fa-sack-dollar', value: money(revenue), sub: `<b>${money(revenueThisWeek)}</b> in the last 7 days`, href: './admin-orders.html' },
      { label: 'Orders', icon: 'fa-receipt', value: totals.orders, sub: `<b>${ordersThisWeek}</b> this week · avg ${money(avgOrder)}`, href: './admin-orders.html' },
      { label: 'Customers', icon: 'fa-users', value: totals.customers ?? '—', sub: `<b>${totals.products ?? '—'}</b> products in the catalog`, href: './admin-users.html' },
      { label: 'Pending returns', icon: 'fa-rotate-left', value: pendingReturns, sub: needsReview ? `<b>${needsReview}</b> drop-off${needsReview > 1 ? 's' : ''} need review` : 'No drop-offs waiting for review', href: './admin-returns.html', alert: pendingReturns > 0 || needsReview > 0 },
    ];
    document.getElementById('kpis').innerHTML = kpis.map((k) => `
      <a class="card kpi ${k.alert ? 'alert' : ''}" href="${k.href}">
        <div class="kpi-top"><span class="kpi-label">${k.label}</span><span class="kpi-icon"><i class="fa-solid ${k.icon}"></i></span></div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
      </a>`).join('');

    // ── Orders chart (last 14 days) ──────────────────────────────────────────
    const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d; });
    const perDay = days.map((d) => {
      const list = orders.filter((o) => dayKey(o.createdAt) === dayKey(d));
      return { date: d, count: list.length, revenue: list.filter((o) => !['cancelled', 'refunded'].includes(o.status)).reduce((s, o) => s + (o.totalPrice || 0), 0) };
    });
    const maxCount = Math.max(4, ...perDay.map((d) => d.count));
    const W = 700, H = 200, padL = 26, padB = 22, gap = 10;
    const bw = (W - padL - gap * 13) / 14;
    const yTicks = [0, Math.round(maxCount / 2), maxCount];
    const chartEl = document.getElementById('orders-chart');
    chartEl.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Orders per day, last 14 days">
        ${yTicks.map((t) => { const y = (H - padB) - (t / maxCount) * (H - padB - 8); return `<line class="grid" x1="${padL}" x2="${W}" y1="${y}" y2="${y}"/><text x="0" y="${y + 4}">${t}</text>`; }).join('')}
        ${perDay.map((d, i) => {
          const h = (d.count / maxCount) * (H - padB - 8);
          const x = padL + i * (bw + gap);
          const label = d.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          return `<g><title>${label}: ${d.count} order${d.count === 1 ? '' : 's'} · ${money(d.revenue)}</title>
            <rect x="${x}" y="${padL - 26}" width="${bw}" height="${H - padB}" fill="transparent"/>
            <rect class="bar ${i === 13 ? 'today' : ''}" x="${x}" y="${(H - padB) - Math.max(h, d.count ? 3 : 0)}" width="${bw}" height="${Math.max(h, d.count ? 3 : 0)}" rx="5"/>
            ${i % 2 === 1 || i === 13 ? `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${i === 13 ? 'Today' : label}</text>` : ''}
          </g>`;
        }).join('')}
      </svg>`;
    const twoWeekOrders = perDay.reduce((s, d) => s + d.count, 0);
    const twoWeekRevenue = perDay.reduce((s, d) => s + d.revenue, 0);
    const busiest = perDay.reduce((a, b) => (b.count > a.count ? b : a));
    document.getElementById('chart-legend').innerHTML = `
      <div><b>${twoWeekOrders}</b>orders</div>
      <div><b>${money(twoWeekRevenue)}</b>revenue</div>
      <div><b>${busiest.count ? busiest.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'}</b>busiest day</div>`;

    // ── Order status breakdown ───────────────────────────────────────────────
    const statusCounts = Object.keys(ORDER_STATUS).map((s) => ({ s, n: orders.filter((o) => o.status === s).length }));
    const statusMax = Math.max(1, ...statusCounts.map((x) => x.n));
    document.getElementById('status-sub').textContent = orders.length < totals.orders ? `Latest ${orders.length} of ${totals.orders} orders` : `All ${orders.length} orders`;
    document.getElementById('status-list').innerHTML = orders.length
      ? statusCounts.map(({ s, n }) => `
          <div class="status-row">
            <span>${ORDER_STATUS[s].label}</span>
            <div class="track"><i style="width:${(n / statusMax) * 100}%;background:${ORDER_STATUS[s].color}"></i></div>
            <span>${n}</span>
          </div>`).join('')
      : empty('fa-receipt', 'No orders yet');

    // ── SmartBox checks ──────────────────────────────────────────────────────
    const checked = latestSessions.filter((s) => s.verification);
    const count = (v) => checked.filter((s) => s.verification.verdict === v).length;
    const flagged = checked.filter((s) => ['review', 'error'].includes(s.verification.verdict)).slice(0, 3);
    document.getElementById('smartbox').innerHTML = checked.length ? `
      <div class="verdicts">
        <div class="verdict ok"><b>${count('match')}</b><span>Verified</span></div>
        <div class="verdict warn"><b>${count('review')}</b><span>Needs review</span></div>
        <div class="verdict err"><b>${count('error')}</b><span>Check failed</span></div>
      </div>
      <div class="list-label">${flagged.length ? 'Waiting for your review' : 'Latest drop-offs'}</div>
      <div class="list">
        ${(flagged.length ? flagged : checked.slice(0, 3)).map((s) => {
          const v = s.verification;
          const reason = v.verdict === 'match' ? 'Matches the returned item' + (v.weight?.measured != null ? ` · ${v.weight.measured} g` : '') : v.reasons?.[0] || '';
          return `<a class="item" href="./admin-camera.html">
            ${s.imageUrl ? `<img class="thumb" src="${esc(s.imageUrl)}" alt="">` : '<span class="thumb"><i class="fa-solid fa-camera"></i></span>'}
            <div class="item-main">
              <div class="item-title">${esc(s.boxId)} · locker ${esc(s.returnId?.lockerUserId || '—')}</div>
              <div class="item-meta">${esc(reason)}</div>
            </div>
            <div class="item-side">${verdictChip(v)}<span class="item-meta">${ago(s.capturedAt || s.createdAt)}</span></div>
          </a>`;
        }).join('')}
      </div>`
      : empty('fa-box-open', 'No SmartBox drop-offs yet');

    // ── Recent returns ───────────────────────────────────────────────────────
    document.getElementById('returns-sub').textContent = `${totals.returns} total · ${pendingReturns} pending`;
    const recentReturns = returns.slice(0, 5);
    document.getElementById('returns-list').innerHTML = recentReturns.length
      ? recentReturns.map((r) => {
          const item = r.items?.[0];
          const more = (r.items?.length || 0) > 1 ? ` +${r.items.length - 1}` : '';
          const who = r.userId ? (r.userId.fullName || r.userId.email) : 'Guest';
          return `<a class="item" href="./admin-returns.html">
            ${r.imageUrl ? `<img class="thumb" src="${esc(r.imageUrl)}" alt="">` : '<span class="thumb"><i class="fa-solid fa-rotate-left"></i></span>'}
            <div class="item-main">
              <div class="item-title">${esc(item ? `${item.name}${more}` : 'Return')}</div>
              <div class="item-meta">${esc(who)} · ${esc((r.reason || '').replace(/_/g, ' '))} · ${ago(r.createdAt)}</div>
            </div>
            <div class="item-side">
              <span class="badge ${RETURN_STATUS[r.status] || 'badge-info'}">${esc(r.status)}</span>
              ${r.verification ? verdictChip(r.verification) : ''}
            </div>
          </a>`;
        }).join('')
      : empty('fa-inbox', 'No returns yet');

    // ── Recent orders ────────────────────────────────────────────────────────
    document.getElementById('orders-body').innerHTML = orders.length
      ? orders.slice(0, 6).map((o) => {
          const items = (o.products || []).reduce((s, p) => s + (p.quantity || 0), 0);
          return `<tr>
            <td><span class="order-id">#${esc(o.randomId || o.orderNumber)}</span></td>
            <td>${esc(`${o.firstName || ''} ${o.lastName || ''}`.trim() || o.email)}</td>
            <td class="hide-sm muted">${items} item${items === 1 ? '' : 's'}</td>
            <td class="hide-sm muted">${fmtDate(o.createdAt)}</td>
            <td>${orderBadge(o.status)}</td>
            <td style="font-weight:600">${money(o.totalPrice)}</td>
          </tr>`;
        }).join('')
      : `<tr><td colspan="6">${empty('fa-receipt', 'No orders yet')}</td></tr>`;
  </script>
</body>
</html>
